[package]
name = "updater"
version = "1.0.0"
edition = "2021"
description = "Linux 更新管理器（Rust 重写版）"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
regex = "1"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
zip = "2"
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
subtle = "2"

[profile.release]
opt-level = 2
strip = true
lto = true
codegen-units = 1
panic = "abort"
